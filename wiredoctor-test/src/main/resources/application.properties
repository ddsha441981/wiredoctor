# Demo intentionally contains a resolvable AlphaBean<->BetaBean cycle so WireDoctor can detect it.
# Spring prohibits circular references by default; this flag lets the demo boot out-of-the-box.
spring.main.allow-circular-references=true

# WireDoctor configuration
wiredoctor.enabled=true
wiredoctor.output-path=${user.home}/Desktop/wiredoctor-reports
wiredoctor.slow-bean-threshold-ms=50
# wiredoctor.scan-packages=com.wiredoctortest
